---
layout: default
---
<article>
    <header>
        <h1>{{ page.title }}</h1>
        <p>
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
            {% if page.tags and page.tags.size > 0 %}· {{ page.tags | join: ", " }}{% endif %}
        </p>
    </header>

    {{ content }}

    {% if page.page %}
    <footer>
        <p>Краткая версия: <a href="{{ page.page | relative_url }}">страница-выжимка</a></p>
    </footer>
    {% endif %}
</article>
